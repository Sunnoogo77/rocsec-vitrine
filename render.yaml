# Production uniquement ; déploiements manuels pendant le blocage GitHub Actions.
services:
  - type: web
    name: rocsec-vitrine-production
    runtime: static
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: node scripts/render-build.mjs
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_API_BASE_URL
        # La vitrine utilise les endpoints publics, sans cookie de connexion.
        value: https://rocsec-back.onrender.com/api/v1
      - key: VITE_HCAPTCHA_SITEKEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://hcaptcha.com https://*.hcaptcha.com; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
